<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Render</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/formiojs@4.14.13/dist/formio.full.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" />
  <style>
    /* ── Reset ── */
    *, *::before, *::after { box-sizing: border-box; }

    /* ── Base ── */
    html, body {
      margin: 0; padding: 18px 20px 28px;
      font-family: 'Geist', 'Segoe UI', -apple-system, sans-serif;
      background: #fff; color: #0A1530;
      -webkit-font-smoothing: antialiased;
      font-size: 14px; line-height: 1.5;
    }
    #render { width: 100%; }

    /* ── Width reset — force form.io column wrappers to fill container ── */
    /* form.io wraps every field in col-sm-N; without a .row parent the
       Bootstrap sm breakpoint may not fire, leaving inputs at natural width */
    .formio-form,
    .formio-component { width: 100% !important; }

    .formio-component > [class*="col-"] {
      width: 100% !important;
      max-width: 100% !important;
      float: none !important;
      padding-left: 0 !important;
      padding-right: 0 !important;
    }
    /* But re-allow multi-column layouts to use flex proportional widths */
    .formio-component-columns > .row > [class*="col-"],
    .formio-component-columns > [class*="col-"] {
      width: auto !important;
      max-width: none !important;
      flex: 1 !important;
      padding: 0 !important;
    }

    /* ── Labels ── */
    label, .col-form-label, .control-label {
      font-family: 'Geist', sans-serif !important;
      font-size: 12px !important;
      font-weight: 600 !important;
      color: #374151 !important;
      margin-bottom: 5px !important;
      letter-spacing: 0.01em !important;
      display: block;
    }

    /* ── Inputs ── */
    .form-control {
      display: block !important;
      width: 100% !important;
      font-family: 'Geist', sans-serif !important;
      border: 1.5px solid #CBD5E1 !important;
      border-radius: 8px !important;
      padding: 9px 12px !important;
      font-size: 13.5px !important;
      color: #111827 !important;
      background: #fff !important;
      transition: border-color 120ms, box-shadow 120ms !important;
      box-shadow: none !important;
      height: auto !important;
    }
    .form-control:focus {
      border-color: #0A2D63 !important;
      box-shadow: 0 0 0 3px rgba(10,45,99,0.09) !important;
      outline: none !important;
    }
    .form-control::placeholder { color: #94A3B8 !important; font-size: 13px !important; }

    textarea.form-control { resize: vertical; min-height: 80px; }
    select.form-control { cursor: pointer; appearance: auto; }

    /* ── Form groups ── */
    .form-group, .formio-component { margin-bottom: 18px !important; }
    .formio-component:last-child { margin-bottom: 4px !important; }

    /* ── Required asterisk ── */
    .field-required .col-form-label::after,
    .field-required label::after {
      content: ' *'; color: #DC2626; font-weight: 700;
    }

    /* ── Buttons ── */
    .btn {
      font-family: 'Geist', sans-serif !important;
      border-radius: 8px !important;
      font-weight: 600 !important;
      font-size: 13.5px !important;
      padding: 8px 18px !important;
      transition: opacity 120ms, transform 80ms !important;
      border: none !important;
      cursor: pointer !important;
      line-height: 1.4 !important;
    }
    .btn:hover { opacity: 0.88 !important; }
    .btn:active { transform: scale(0.98) !important; }
    .btn-primary   { background: #0A2D63 !important; color: #fff !important; }
    .btn-secondary { background: #EFECE2 !important; color: #2A3349 !important; }
    .btn-success   { background: #2D5D4A !important; color: #fff !important; }
    .btn-danger    { background: #DC2626 !important; color: #fff !important; }
    .btn-warning   { background: #F7C92E !important; color: #07173a !important; }
    .btn-info      { background: #0284C7 !important; color: #fff !important; }
    .btn-default   { background: #EFECE2 !important; color: #2A3349 !important; border: 1.5px solid rgba(10,21,48,0.14) !important; }

    /* ── Checkboxes & Radios ── */
    .form-check { display: flex; align-items: center; gap: 9px; margin-bottom: 6px; }
    .form-check-input, input[type="checkbox"], input[type="radio"] {
      accent-color: #0A2D63 !important;
      width: 15px !important; height: 15px !important;
      cursor: pointer !important; flex-shrink: 0 !important;
    }
    .form-check-label, .radio label, .checkbox label {
      font-size: 13.5px !important; color: #111827 !important;
      font-weight: 400 !important; cursor: pointer !important; margin-bottom: 0 !important;
    }
    /* Radio option as a card */
    .formio-component-radio .form-check {
      padding: 8px 13px; border-radius: 8px;
      border: 1.5px solid #E2E8F0; background: #fff;
      transition: border-color 100ms, background 100ms;
    }
    .formio-component-radio .form-check:has(input:checked) {
      border-color: #0A2D63; background: rgba(10,45,99,0.04);
    }
    /* Inline radio: horizontal */
    .formio-component-radio.radio-inline .form-check {
      display: inline-flex; margin-right: 8px; margin-bottom: 6px;
    }

    /* ── Input groups ── */
    .input-group {
      display: flex !important;
      flex-wrap: nowrap !important;
      align-items: stretch !important;
      width: 100% !important;
    }
    .input-group > .form-control {
      flex: 1 1 auto !important;
      width: 1% !important;
      min-width: 0 !important;
      position: relative !important;
      z-index: 1 !important;
    }
    .input-group-prepend,
    .input-group-append {
      display: flex !important;
      align-items: center !important;
    }
    .input-group-text, .input-group-addon {
      font-family: 'Geist', sans-serif !important;
      background: #F6F4EE !important;
      border: 1.5px solid rgba(10,21,48,0.16) !important;
      color: #5B6478 !important;
      font-size: 13.5px !important;
      padding: 8px 12px !important;
      display: flex !important;
      align-items: center !important;
      white-space: nowrap !important;
    }
    .input-group .form-control { border-radius: 8px 0 0 8px !important; }
    .input-group .input-group-text:first-child,
    .input-group .input-group-addon:first-child { border-radius: 8px 0 0 8px !important; }
    .input-group-append .btn,
    .input-group-append .input-group-text { border-radius: 0 8px 8px 0 !important; }
    .input-group-prepend .btn,
    .input-group-prepend .input-group-text { border-radius: 8px 0 0 8px !important; }

    /* ── Panel / Card ── */
    .card, .panel, .panel-default {
      border: 1.5px solid rgba(10,21,48,0.12) !important;
      border-radius: 12px !important;
      overflow: hidden !important;
      box-shadow: 0 2px 8px rgba(10,21,48,0.06) !important;
      margin-bottom: 16px !important;
    }
    .card-header, .panel-heading {
      background: #F6F4EE !important;
      border-bottom: 1px solid rgba(10,21,48,0.08) !important;
      padding: 10px 18px !important;
      font-family: 'Geist', sans-serif !important;
      font-weight: 700 !important; font-size: 13.5px !important;
      color: #0A1530 !important;
    }
    .card-body, .panel-body { padding: 18px !important; }

    /* ── Description / help text ── */
    .help-block, .form-text {
      font-size: 11.5px !important; color: #64748B !important;
      margin-top: 5px !important; font-style: normal !important; line-height: 1.5 !important;
    }
    .has-error .form-control { border-color: #DC2626 !important; }
    .help-block.text-danger { color: #DC2626 !important; font-size: 12px !important; }

    /* ── Firma preview button ── */
    .firma-preview-btn:hover {
      background: #EDE9FE !important; border-color: #6D28D9 !important; color: #5B21B6 !important;
    }
    .firma-preview-btn:active { transform: scale(0.97); }

    /* ── Tables (survey / datagrid) ── */
    .table {
      font-family: 'Geist', sans-serif !important;
      border-collapse: separate !important; border-spacing: 0 !important;
      width: 100% !important; font-size: 13.5px !important;
      border-radius: 8px !important; overflow: hidden !important;
    }
    .table thead th {
      background: #F6F4EE !important; font-size: 11.5px !important;
      font-weight: 700 !important; color: #5B6478 !important;
      border-bottom: 1.5px solid rgba(10,21,48,0.12) !important;
      padding: 9px 14px !important;
      text-align: center !important;
      white-space: normal !important; word-break: break-word !important;
    }
    .table thead th:first-child { text-align: left !important; }
    .table tbody td {
      padding: 8px 14px !important; color: #2A3349 !important;
      border-bottom: 1px solid rgba(10,21,48,0.06) !important;
      text-align: center !important; vertical-align: middle !important;
    }
    .table tbody td:first-child { text-align: left !important; font-size: 13px !important; }
    .table tbody tr:nth-child(even) td { background: #FAFAFA !important; }
    .table tbody tr:last-child td { border-bottom: none !important; }
    .table-bordered { border: 1.5px solid rgba(10,21,48,0.12) !important; border-radius: 8px !important; overflow: hidden !important; }
    /* Survey radio cells — center the radio in the cell */
    .table tbody td input[type="radio"] {
      display: block !important; margin: 0 auto !important;
      accent-color: #0A2D63 !important; width: 16px !important; height: 16px !important;
    }

    /* ── DataGrid ── */
    .datagrid-table { border: 1.5px solid rgba(10,21,48,0.12) !important; border-radius: 8px !important; overflow: hidden !important; }
    .btn-sm { padding: 4px 12px !important; font-size: 12px !important; border-radius: 6px !important; }

    /* DataGrid remove row button — FA4 icon doesn't load in FA5; replace with CSS × */
    .formio-button-remove-row {
      background: #FEF2F2 !important;
      border: 1.5px solid #FCA5A5 !important;
      color: #EF4444 !important;
      width: 32px !important; height: 32px !important;
      padding: 0 !important;
      display: inline-flex !important;
      align-items: center !important; justify-content: center !important;
    }
    .formio-button-remove-row i,
    .formio-button-remove-row span { display: none !important; }
    .formio-button-remove-row::after {
      content: '×';
      font-size: 18px; font-weight: 700;
      font-family: 'Geist', sans-serif; line-height: 1; color: #EF4444;
    }
    .formio-button-remove-row:hover { background: #FEE2E2 !important; }

    /* DataGrid add row button */
    .formio-button-add-row {
      margin-top: 10px !important;
      background: #EFF6FF !important;
      border: 1.5px solid #BFDBFE !important;
      color: #2563EB !important;
    }
    .formio-button-add-row:hover { background: #DBEAFE !important; }

    /* ── Day component (day / month / year selects in a Bootstrap row) ── */
    .formio-component-day .row {
      display: flex !important; gap: 8px !important; margin: 0 !important;
    }
    .formio-component-day .row > [class*="col-"] {
      flex: 1 !important; padding: 0 !important;
      max-width: none !important; min-width: 0 !important; width: auto !important;
    }
    .formio-component-day .row > [class*="col-"] label {
      font-size: 11px !important; color: #8A8F9F !important; font-weight: 500 !important;
    }

    /* ── DateTime (flatpickr + input-group) ── */
    .formio-component-datetime .input-group-append .btn {
      border-radius: 0 8px 8px 0 !important;
      border: 1.5px solid rgba(10,21,48,0.16) !important; border-left: none !important;
      background: #F6F4EE !important; color: #5B6478 !important;
      padding: 0 10px !important;
    }
    .formio-component-datetime .flatpickr-input {
      border-radius: 8px 0 0 8px !important; border: 1.5px solid rgba(10,21,48,0.16) !important;
    }

    /* ── Content HTML components ── */
    .formio-component-content { line-height: 1.65; margin-bottom: 6px !important; }
    /* Headings from the form builder render as h1-h4 inside content — style as section headers */
    .formio-component-content h1,
    .formio-component-content h2,
    .formio-component-content h3,
    .formio-component-content h4 {
      font-family: 'Geist', sans-serif !important;
      font-weight: 700 !important;
      color: #0A2D63 !important;
      margin: 18px 0 10px !important;
      padding-bottom: 8px !important;
      border-bottom: 2px solid #EEF2F9 !important;
      display: flex !important; align-items: center !important;
      gap: 10px !important;
      font-size: 12px !important;
      text-transform: uppercase !important;
      letter-spacing: 0.07em !important;
    }
    .formio-component-content h1::before,
    .formio-component-content h2::before,
    .formio-component-content h3::before,
    .formio-component-content h4::before {
      content: ''; display: inline-block;
      width: 3px; height: 16px; border-radius: 2px;
      background: #0A2D63; flex-shrink: 0;
    }
    .formio-component-content p  { margin: 0 0 8px; font-size: 13.5px; color: #374151; }
    .formio-component-content img { max-width: 100%; border-radius: 8px; display: block; }
    .formio-component-content hr { border: none; border-top: 1.5px solid #EEF2F9; margin: 8px 0; }
    .formio-component-content strong { font-weight: 700; }
    .formio-component-content ul, .formio-component-content ol { padding-left: 20px; margin: 0 0 10px; }
    .formio-component-content li { margin-bottom: 4px; font-size: 13.5px; }

    /* ── Columns ── */
    /* Make the columns container itself a flex row, covering both:
       A) form.io wraps in .row:  .formio-component-columns > .row > .col-sm-6
       B) form.io renders directly: .formio-component-columns > .col-sm-6          */
    .formio-component-columns {
      display: flex !important;
      flex-wrap: nowrap !important;
      align-items: flex-start !important;
      gap: 16px !important;
      margin-bottom: 16px;
    }
    /* Case A: .row is the only flex child — give it full width, then lay out cols inside */
    .formio-component-columns > .row {
      flex: 1 1 100% !important;
      display: flex !important;
      flex-wrap: nowrap !important;
      margin: 0 !important;
      gap: 16px !important;
    }
    /* Both cases: column divs get equal flex width */
    .formio-component-columns > .row > [class*="col-"],
    .formio-component-columns > [class*="col-"] {
      flex: 1 !important;
      padding: 0 !important;
      max-width: none !important;
      min-width: 0 !important;
      width: auto !important;
    }

    /* ── Choices.js (select) ── */
    .choices__inner {
      font-family: 'Geist', sans-serif !important;
      border: 1.5px solid #CBD5E1 !important;
      border-radius: 8px !important;
      padding: 7px 10px !important;
      font-size: 13.5px !important;
      background: #fff !important;
      min-height: auto !important;
    }
    .choices__inner:focus-within { border-color: #0A2D63 !important; box-shadow: 0 0 0 3px rgba(10,45,99,0.09) !important; }
    .choices__input { font-family: 'Geist', sans-serif !important; font-size: 13px !important; background: transparent !important; }
    .choices__list--dropdown { border-radius: 8px !important; border: 1.5px solid #CBD5E1 !important; box-shadow: 0 8px 24px rgba(10,21,48,0.12) !important; margin-top: 4px !important; overflow: hidden; }
    .choices__list--dropdown .choices__item--selectable { font-size: 13.5px !important; color: #2A3349 !important; padding: 9px 12px !important; }
    .choices__list--dropdown .choices__item--selectable.is-highlighted { background: #EEF2FF !important; color: #0A2D63 !important; }

    /* ── Flatpickr (datetime) ── */
    .flatpickr-input { font-family: 'Geist', sans-serif !important; }
    .flatpickr-calendar { font-family: 'Geist', sans-serif !important; border-radius: 12px !important; box-shadow: 0 8px 32px rgba(10,21,48,0.14) !important; }
    .flatpickr-day.selected { background: #0A2D63 !important; border-color: #0A2D63 !important; }
    .flatpickr-day:hover { background: #EEF2FF !important; }

    /* ── Alert / validation errors ── */
    .alert-danger { background: #FEF2F2 !important; border: 1.5px solid #FECACA !important; border-radius: 8px !important; color: #DC2626 !important; font-size: 13px !important; padding: 10px 14px !important; }
  </style>
</head>
<body>
  <input name="jsonData" id="jsonData" value="" type="hidden" />
  <div id="render"></div>

  <script src="https://cdn.jsdelivr.net/npm/formiojs@4.14.13/dist/formio.full.min.js"></script>
  <script>
    window.onload = function () {
      var currentForm = null;
      var currentSchema = null;

      function notifyHeight() {
        var h = document.body.scrollHeight;
        window.top.postMessage({ type: 'HEIGTH', value: h + 'px' }, '*');
      }

      function createForm(schema, submissionData, options) {
        // Save current form data before destroying so a re-render does not erase typed values.
        var savedSubmission = null;
        if (currentForm) {
          try { savedSubmission = currentForm.submission; } catch(e) {}
          try { currentForm.destroy(); } catch(e) {}
          document.getElementById('render').innerHTML = '';
        }
        currentSchema = schema;
        Formio.icons = 'fontawesome';
        var formOptions = Object.assign({ breadcrumbSettings: { clickable: false } }, options || {});
        Formio.createForm(document.getElementById('render'), schema, formOptions).then(function (form) {
          currentForm = form;
          // Explicit submissionData wins; otherwise restore what was typed before.
          var dataToRestore = submissionData || savedSubmission;
          if (dataToRestore) form.submission = dataToRestore;
          if (!formOptions.readOnly) {
            form.on('change', function () {
              var jsonData = JSON.stringify(form.submission, null, 4);
              document.getElementById('jsonData').value = jsonData;
              notifyHeight();
              window.top.postMessage({ type: 'GET_JSONDATA', value: jsonData }, '*');
            });
          }
          setTimeout(notifyHeight, 400);
        });
      }

      // Delegated listener for firma-preview buttons injected via HTML content components.
      // We use event delegation instead of onclick attrs because form.io runs content HTML
      // through DOMPurify which strips inline event handlers.
      document.addEventListener('click', function (e) {
        var btn = e.target.closest('.firma-preview-btn');
        if (!btn) return;
        var d = btn.dataset;
        window.parent.postMessage({ type: 'FIRMA_PREVIEW', firmaKey: d.fk, texto: d.tx, grupo: d.gr }, '*');
      });

      window.addEventListener('message', function (e) {
        if (e.data.type === 'RENDER_JSON') {
          try { createForm(JSON.parse(e.data.value), null, null); }
          catch(err) { console.error('RENDER_JSON parse error', err); }
        }
        if (e.data.type === 'RENDER_JSON_WITH_DATA') {
          try { createForm(JSON.parse(e.data.value), JSON.parse(e.data.data), null); }
          catch(err) { console.error('RENDER_JSON_WITH_DATA parse error', err); }
        }
        if (e.data.type === 'LOCK_FORM') {
          // Re-render el formulario en modo solo lectura conservando los datos ingresados.
          if (currentForm && currentSchema) {
            var savedSub = null;
            try { savedSub = currentForm.submission; } catch(e) {}
            createForm(currentSchema, savedSub, { readOnly: true });
          }
        }
        if (e.data.type === 'GETDATA_JSON') {
          window.top.postMessage({ type: 'GETDATARESPONSE_JSON', value: document.getElementById('jsonData').value }, '*');
        }
      });
    };
  </script>
</body>
</html>
